<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>考研英语词汇</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* 柔和的深青色/石板灰主题 */
      --bg-base: #0f172a;
      /* slate-900 */
      --bg-card: rgba(30, 41, 59, 0.7);
      /* slate-800 with opacity for glass effect */
      --bg-elevated: rgba(51, 65, 85, 0.6);
      /* slate-700 */
      --bg-option: rgba(51, 65, 85, 0.4);
      --bg-option-hover: rgba(71, 85, 105, 0.5);
      /* slate-600 */
      --border: rgba(71, 85, 105, 0.4);
      --border-hover: rgba(100, 116, 139, 0.5);
      /* slate-500 */

      --text-primary: #f8fafc;
      /* slate-50 */
      --text-secondary: #cbd5e1;
      /* slate-300 */
      --text-muted: #94a3b8;
      /* slate-400 */

      /* 强调色：青色/薄荷绿，护眼且清晰 */
      --accent: #14b8a6;
      /* teal-500 */
      --accent-light: #5eead4;
      /* teal-300 */
      --accent-dark: #0d9488;
      /* teal-600 */
      --accent-glow: rgba(20, 184, 166, 0.15);

      /* 反馈色 */
      --correct: #10b981;
      /* emerald-500 */
      --correct-bg: rgba(16, 185, 129, 0.1);
      --correct-border: rgba(16, 185, 129, 0.3);

      --wrong: #f43f5e;
      /* rose-500 */
      --wrong-bg: rgba(244, 63, 94, 0.1);
      --wrong-border: rgba(244, 63, 94, 0.3);

      --radius: 16px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 极简氛围背景 ===== */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 0%, rgba(20, 184, 166, 0.05) 0%, transparent 70%);
    }

    .ambient::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      bottom: -50%;
      left: 0;
      background: radial-gradient(circle at 50% 100%, rgba(14, 165, 233, 0.03) 0%, transparent 60%);
    }

    /* 磨砂质感噪点 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* ===== 布局 ===== */
    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px;
      padding-bottom: 60px;
    }

    /* ===== 头部 ===== */
    .header {
      text-align: center;
      padding: 48px 0 32px;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 8px 24px rgba(20, 184, 166, 0.2);
      color: white;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-primary);
    }

    .header .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 400;
    }

    /* ===== 统计卡片 ===== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 12px;
      text-align: center;
      transition: var(--transition);
    }

    .stat-card:hover {
      border-color: var(--border-hover);
      background: rgba(30, 41, 59, 0.9);
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      line-height: 1;
    }

    .stat-value.val-total {
      color: var(--text-primary);
    }

    .stat-value.val-correct {
      color: var(--correct);
    }

    .stat-value.val-wrong {
      color: var(--wrong);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    /* ===== 筛选栏 ===== */
    .filter-scroll {
      margin-bottom: 24px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      padding: 2px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      flex-shrink: 0;
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      white-space: nowrap;
      user-select: none;
    }

    .pill:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
      background: var(--bg-elevated);
    }

    .pill.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* ===== 题目卡片 ===== */
    .q-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      animation: slideUp 0.4s ease-out;
      position: relative;
      overflow: hidden;
    }

    .q-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #0ea5e9, var(--accent));
      opacity: 0.8;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .q-tag {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .tag-cloze50 {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .tag-attitude {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .tag-basic {
      background: rgba(14, 165, 233, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(14, 165, 233, 0.3);
    }

    .tag-advanced {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .tag-family {
      background: rgba(20, 184, 166, 0.15);
      color: var(--accent-light);
      border: 1px solid rgba(20, 184, 166, 0.3);
    }

    .q-counter {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .q-text {
      font-size: 1.1rem;
      line-height: 1.8;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 28px;
    }

    /* ===== 选项列表 ===== */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 20px;
      background: var(--bg-option);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-primary);
      text-align: left;
    }

    .opt:hover:not(.locked) {
      border-color: var(--accent-dark);
      background: var(--bg-option-hover);
    }

    .opt:active:not(.locked) {
      transform: scale(0.99);
    }

    .opt-key {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-xs);
      background: rgba(255, 255, 255, 0.08);
      font-weight: 600;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .opt:hover:not(.locked) .opt-key {
      background: var(--accent);
      color: #fff;
    }

    /* 选项反馈状态 */
    .opt.is-correct {
      border-color: var(--correct-border);
      background: var(--correct-bg);
    }

    .opt.is-correct .opt-key {
      background: var(--correct);
      color: #fff;
    }

    .opt.is-wrong {
      border-color: var(--wrong-border);
      background: var(--wrong-bg);
    }

    .opt.is-wrong .opt-key {
      background: var(--wrong);
      color: #fff;
    }

    .opt.locked {
      cursor: default;
      pointer-events: none;
    }

    .opt.locked:not(.is-correct):not(.is-wrong) {
      opacity: 0.5;
    }

    /* ===== 词族二级筛选条 ===== */
    .sub-filter-scroll {
      margin-bottom: 20px;
      animation: fadeIn 0.25s ease;
    }

    .sub-filter-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2px;
    }

    .sub-pill {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.5);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      font-family: inherit;
    }

    .sub-pill:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
      background: var(--bg-elevated);
    }

    .sub-pill.active {
      background: rgba(20, 184, 166, 0.18);
      color: var(--accent-light);
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* ===== 反馈结果区 ===== */
    .result {
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      line-height: 1.6;
      animation: slideUp 0.3s ease-out;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .result-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      line-height: 1.5;
    }

    .result-body {
      font-size: 0.9rem;
      flex: 1;
    }
    .answer-word {
      margin-top: 8px;
      font-size: 0.88rem;
      color: var(--text-primary);
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.6;
    }
    .answer-word b {
      color: var(--accent-light);
      font-style: italic;
      font-size: 0.95rem;
      margin-right: 6px;
    }
    .answer-detail-row {
      margin-top: 6px;
      font-size: 0.82rem;
      line-height: 1.5;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.22);
    }
    .answer-phrase {
      color: #7dd3fc;
      border-left: 2px solid #0284c7;
    }
    .answer-family {
      color: #a7f3d0;
      border-left: 2px solid #059669;
    }
    .answer-tip {
      color: #f472b6;
      border-left: 2px solid #e11d48;
    }
    .answer-mnemonic {
      color: #fde047;
      border-left: 2px solid #ca8a04;
    }
    .answer-cite {
      color: #94a3b8;
      border-left: 2px solid #64748b;
      font-style: italic;
    }

    .result.r-correct {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: #6ee7b7;
    }

    .result.r-wrong {
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
      color: #fda4af;
    }

    .answer-text {
      display: block;
      color: var(--text-primary);
      font-weight: 500;
      margin-top: 6px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* ===== 底部导航 ===== */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      gap: 16px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .nav-btn:hover:not(:disabled) {
      color: var(--text-primary);
      border-color: var(--border-hover);
      background: var(--bg-elevated);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
    }

    .nav-pos {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 进度条 */
    .progress {
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* ===== 空状态 ===== */
    .empty {
      text-align: center;
      padding: 64px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
    }

    .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
      display: block;
      opacity: 0.8;
    }

    .empty-text {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ===== 清除错题按钮 ===== */
    .clear-wrong-bar {
      text-align: right;
      margin-bottom: 16px;
      animation: slideUp 0.3s ease;
    }

    .clear-wrong-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .clear-wrong-btn:hover {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong);
    }

    /* ===== 确认弹窗 ===== */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
      padding: 20px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .dialog-box {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      animation: dialogPop 0.25s ease;
    }

    @keyframes dialogPop {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .dialog-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .dialog-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .dialog-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .dialog-actions button {
      padding: 10px 20px;
      border-radius: var(--radius-xs);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .btn-cancel:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .btn-danger {
      background: var(--wrong);
      border: 1px solid var(--wrong);
      color: #fff;
    }

    .btn-danger:hover {
      background: #e11d48;
      border-color: #e11d48;
    }

    /* ===== 移动端适配 ===== */
    @media (max-width: 480px) {
      .app {
        padding: 0 16px;
        padding-bottom: 40px;
      }

      .header {
        padding: 32px 0 24px;
      }

      .header h1 {
        font-size: 1.4rem;
      }

      .q-card {
        padding: 24px 20px;
      }

      .q-text {
        font-size: 1rem;
        margin-bottom: 24px;
      }

      .stat-value {
        font-size: 1.3rem;
      }

      .nav-btn {
        padding: 10px 16px;
        font-size: 0.8rem;
      }

      .filter-row {
        justify-content: flex-start;
      }

      .clear-wrong-btn {
        padding: 6px 12px;
        font-size: 0.8rem;
      }
    }

    }
  </style>
</head>

<body>
  <div class="ambient"></div>
  <div class="app">

    <div class="header">
      <div class="header-icon">📖</div>
      <h1>考研英语词汇</h1>
      <div class="subtitle">共 <span id="total">0</span> 题 · 专注刷题</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value val-total" id="sAnswered">0</div>
        <div class="stat-label">已答</div>
      </div>
      <div class="stat-card">
        <div class="stat-value val-correct" id="sCorrect">0</div>
        <div class="stat-label">正确</div>
      </div>
      <div class="stat-card">
        <div class="stat-value val-wrong" id="sWrong">0</div>
        <div class="stat-label">错误</div>
      </div>
    </div>

    <div class="filter-scroll">
      <div class="filter-row" id="filterRow">
        <button class="pill active" data-f="all">全部</button>
        <button class="pill" data-f="cloze50">完形50词</button>
        <button class="pill" data-f="attitude">态度词</button>
        <button class="pill" data-f="family">家族题</button>
        <button class="pill" data-f="basic">基础题</button>
        <button class="pill" data-f="advanced">进阶题</button>
        <button class="pill" data-f="done">✔ 已答</button>
        <button class="pill" data-f="wrong">✖ 错题</button>
        <button class="pill" data-f="shuffle">🔀 随机</button>
        <button class="pill" style="color:var(--wrong)" onclick="confirmResetAll()">🔄 重置</button>
      </div>
    </div>

    <div class="sub-filter-scroll" id="subFamilyRow" style="display:none;">
      <div class="sub-filter-row" id="familyBar"></div>
    </div>

    <div id="clearBar"></div>
    <div id="cardArea"></div>

    <div class="nav">
      <button class="nav-btn" id="btnPrev" onclick="go(-1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
        上一题
      </button>
      <span class="nav-pos" id="navPos">0 / 0</span>
      <button class="nav-btn" id="btnNext" onclick="go(1)">
        下一题
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>
    </div>
    <div class="progress">
      <div class="progress-bar" id="pBar"></div>
    </div>

  </div>

  <div id="dialogRoot"></div>

  <script>
    // ===== 状态管理 =====
    // ===== 状态管理 =====
    let ALL = [], filtered = [], idx = 0;
    let record = {};  // globalIdx -> { chosen, correct }
    let wrongs = new Set();
    let nCorrect = 0, nWrong = 0;
    let curFilter = 'all';
    let curFamily = 'all';
    let curSubFilter = 'all';

    const STORAGE_KEY = 'quiz_en_v1';

    // ===== 初始化 =====
    fetch('questions_english.json').then(r => r.json()).then(d => {
      ALL = d;
      document.getElementById('total').textContent = d.length;
      loadProgress();
      apply(curFilter);
    }).catch(e => {
      document.getElementById('cardArea').innerHTML = '<div class="empty"><div class="empty-text">题库加载失败</div></div>';
    });

    // ===== localStorage 持久化 =====
    function saveProgress() {
      try {
        const data = {
          record,
          wrongs: [...wrongs],
          nCorrect,
          nWrong,
          idx,
          curFilter,
          curFamily,
          curSubFilter
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) { /* quota exceeded or private mode, silently ignore */ }
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        record = data.record || {};
        wrongs = new Set(data.wrongs || []);
        nCorrect = data.nCorrect || 0;
        nWrong = data.nWrong || 0;
        idx = data.idx || 0;
        curFilter = data.curFilter || 'all';
        curFamily = data.curFamily || 'all';
        curSubFilter = data.curSubFilter || 'all';

        // 兼容迁移旧分类
        if (['choice', 'judge', 'fill'].includes(curFilter)) {
          curFilter = 'all';
        }

        // restore filter pill active state
        document.querySelectorAll('.pill:not([onclick])').forEach(b => {
          b.classList.toggle('active', b.dataset.f === curFilter);
        });
        stats();
      } catch (e) { /* corrupt data, start fresh */ }
    }

    // ===== 二级子筛选条动态渲染 =====
    function renderSubFilterBar() {
      const subRow = document.getElementById('subFamilyRow');
      const bar = document.getElementById('familyBar');

      if (curFilter === 'family') {
        subRow.style.display = 'block';
        const famOrder = ['act', 'tract', 'spect', 'form', 'port', 'dict', 'press', 'ex', 're', 'in', 'con', 'pos', 'auto', 'ten/tain', 'vis/vid', 'cept/ceive', 'grad/gress', 'duc/duct'];
        const famSet = [];
        famOrder.forEach(f => {
          if (ALL.some(q => q.type === 'family' && q.family === f)) famSet.push(f);
        });
        ALL.forEach(q => {
          if (q.type === 'family' && q.family && !famSet.includes(q.family)) {
            famSet.push(q.family);
          }
        });

        const totalFamilyCount = ALL.filter(q => q.type === 'family').length;
        let h = `<button class="sub-pill ${curFamily === 'all' ? 'active' : ''}" onclick="pickFamily('all')">全部家族 (${totalFamilyCount})</button>`;
        famSet.forEach(f => {
          const cnt = ALL.filter(q => q.type === 'family' && q.family === f).length;
          h += `<button class="sub-pill ${curFamily === f ? 'active' : ''}" onclick="pickFamily('${f}')">${f} 家族 (${cnt})</button>`;
        });
        bar.innerHTML = h;
      } else if (curFilter === 'cloze50') {
        subRow.style.display = 'block';
        const cats = [
          { key: 'all', label: '全部完形' },
          { key: '一级红花', label: '一级红花 (100%)' },
          { key: '二级红花', label: '二级红花 (>70%)' },
          { key: '绿叶词', label: '绿叶词 (干扰项)' }
        ];
        let h = '';
        cats.forEach(c => {
          const cnt = c.key === 'all'
            ? ALL.filter(q => q.type === 'cloze50').length
            : ALL.filter(q => q.type === 'cloze50' && (q.category || '').includes(c.key)).length;
          h += `<button class="sub-pill ${curSubFilter === c.key ? 'active' : ''}" onclick="pickSubFilter('${c.key}')">${c.label} (${cnt})</button>`;
        });
        bar.innerHTML = h;
      } else if (curFilter === 'attitude') {
        subRow.style.display = 'block';
        const cats = [
          { key: 'all', label: '全部态度' },
          { key: '正态度', label: '正态度 (赞同)' },
          { key: '负态度', label: '负态度 (批判/怀疑)' },
          { key: '中立态度', label: '中立态度 (客观)' },
          { key: '不可选', label: '不可选干扰项' }
        ];
        let h = '';
        cats.forEach(c => {
          const cnt = c.key === 'all'
            ? ALL.filter(q => q.type === 'attitude').length
            : ALL.filter(q => q.type === 'attitude' && (q.category || '').includes(c.key)).length;
          h += `<button class="sub-pill ${curSubFilter === c.key ? 'active' : ''}" onclick="pickSubFilter('${c.key}')">${c.label} (${cnt})</button>`;
        });
        bar.innerHTML = h;
      } else {
        subRow.style.display = 'none';
      }
    }

    function pickFamily(fam) {
      curFamily = fam;
      renderSubFilterBar();
      apply('family');
    }

    function pickSubFilter(sub) {
      curSubFilter = sub;
      renderSubFilterBar();
      apply(curFilter);
    }

    // ===== 主筛选逻辑 =====
    document.getElementById('filterRow').addEventListener('click', e => {
      const btn = e.target.closest('.pill');
      if (!btn || btn.hasAttribute('onclick')) return; // ignore reset button
      document.querySelectorAll('.pill:not([onclick])').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.f;
      curFilter = f;
      curSubFilter = 'all';
      if (f === 'shuffle') {
        renderSubFilterBar();
        filtered = [...ALL].sort(() => Math.random() - 0.5);
        idx = 0;
        render();
      } else {
        apply(f);
      }
    });

    function apply(f) {
      curFilter = f;
      renderSubFilterBar();

      if (f === 'all') filtered = [...ALL];
      else if (f === 'wrong') filtered = ALL.filter((_, i) => wrongs.has(i));
      else if (f === 'done') filtered = ALL.filter((_, i) => record[i]);
      else if (f === 'family') {
        if (curFamily === 'all') filtered = ALL.filter(q => q.type === 'family');
        else filtered = ALL.filter(q => q.type === 'family' && q.family === curFamily);
      } else if (f === 'cloze50') {
        if (curSubFilter === 'all') filtered = ALL.filter(q => q.type === 'cloze50');
        else filtered = ALL.filter(q => q.type === 'cloze50' && (q.category || '').includes(curSubFilter));
      } else if (f === 'attitude') {
        if (curSubFilter === 'all') filtered = ALL.filter(q => q.type === 'attitude');
        else filtered = ALL.filter(q => q.type === 'attitude' && (q.category || '').includes(curSubFilter));
      } else {
        filtered = ALL.filter(q => q.type === f);
      }

      // 自动定位到当前分类下第一道【未作答】的题目
      const firstUnanswered = filtered.findIndex(q => !record[ALL.indexOf(q)]);
      idx = firstUnanswered !== -1 ? firstUnanswered : 0;

      render();
    }

    // ===== 渲染页面 =====
    function render() {
      const area = document.getElementById('cardArea');
      const clearBar = document.getElementById('clearBar');

      // 清理按钮
      const typeLabels = {
        cloze50: '完形50词',
        attitude: '态度词',
        family: '家族题',
        basic: '基础题',
        advanced: '进阶题',
        done: '已答',
        wrong: '错题'
      };
      const hasAnsweredInFilter = filtered.some(q => record[ALL.indexOf(q)]);
      if (['wrong', 'cloze50', 'attitude', 'family', 'basic', 'advanced', 'done'].includes(curFilter) && hasAnsweredInFilter) {
        let label = typeLabels[curFilter] || '';
        if (curFilter === 'family' && curFamily !== 'all') {
          label = `${curFamily} 家族`;
        } else if (curFilter === 'cloze50' && curSubFilter !== 'all') {
          label = curSubFilter;
        } else if (curFilter === 'attitude' && curSubFilter !== 'all') {
          label = curSubFilter;
        }
        clearBar.innerHTML = `<div class="clear-wrong-bar">
      <button class="clear-wrong-btn" onclick="confirmClearType('${curFilter}','${label}')">
        <svg style="width:14px;height:14px;margin-bottom:1px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        清空${label}已答记录
      </button>
    </div>`;
      } else {
        clearBar.innerHTML = '';
      }

      if (!filtered.length) {
        area.innerHTML = `<div class="empty">
      <span class="empty-icon">${curFilter === 'wrong' ? '🎉' : '📭'}</span>
      <div class="empty-text">${curFilter === 'wrong' ? '太棒了，目前没有错题！' : '该分类下暂无题目'}</div>
    </div>`;
        updateNav();
        return;
      }

      const q = filtered[idx];
      const gi = ALL.indexOf(q);

      let tagCls = 'tag-basic', tagText = '基础题';
      if (q.type === 'advanced') {
        tagCls = 'tag-advanced';
        tagText = '进阶题';
      } else if (q.type === 'family') {
        tagCls = 'tag-family';
        tagText = `词族 · ${q.family || '核心'} 家族`;
      } else if (q.type === 'cloze50') {
        tagCls = 'tag-cloze50';
        tagText = `完形 · ${q.category || '红花绿叶'}`;
      } else if (q.type === 'attitude') {
        tagCls = 'tag-attitude';
        tagText = `态度 · ${q.category || '阅读态度'}`;
      }

      const done = record[gi];

      let h = `<div class="q-card">
    <div class="q-meta">
      <span class="q-tag ${tagCls}">${tagText}</span>
      <span class="q-counter">${idx + 1} / ${filtered.length}</span>
    </div>
    <div class="q-text">${esc(q.question)}</div>`;

      if (q.options) {
        h += `<div class="options-list">`;
        for (const [k, v] of Object.entries(q.options)) {
          let c = done ? 'locked' : '';
          if (done && k === q.answer) c += ' is-correct';
          if (done && done.chosen === k && !done.correct) c += ' is-wrong';
          h += `<button class="opt ${c}" onclick="pickChoice('${k}',${gi})">
        <span class="opt-key">${k}</span><span class="opt-label">${esc(v)}</span>
      </button>`;
        }
        h += `</div>`;
      }

      // 答案反馈与考点知识卡片
      if (done) {
        let extraInfo = '';
        if (q.word && q.meaning) {
          extraInfo += `<div class="answer-word">📖 <b>${esc(q.word)}</b> ${esc(q.meaning)}</div>`;
        }
        if (q.technique_tip) {
          extraInfo += `<div class="answer-detail-row answer-tip">${esc(q.technique_tip)}</div>`;
        }
        if (q.phrase) {
          extraInfo += `<div class="answer-detail-row answer-phrase">📌 <b>考点搭配:</b> ${esc(q.phrase)}</div>`;
        }
        if (q.mnemonic) {
          extraInfo += `<div class="answer-detail-row answer-mnemonic">${esc(q.mnemonic)}</div>`;
        }
        if (q.family_note) {
          extraInfo += `<div class="answer-detail-row answer-family">🌱 <b>家族串记:</b> ${esc(q.family_note)}</div>`;
        }
        if (q.exam_cite) {
          extraInfo += `<div class="answer-detail-row answer-cite">📖 <b>真题出处:</b> ${esc(q.exam_cite)}</div>`;
        }

        if (done.correct) {
          h += `<div class="result r-correct"><span class="result-icon">✓</span><div class="result-body">回答正确${extraInfo}</div></div>`;
        } else {
          const at = q.answer + '. ' + (q.options ? q.options[q.answer] : '');
          h += `<div class="result r-wrong"><span class="result-icon">✗</span><div class="result-body">回答错误<span class="answer-text">${esc(at)}</span>${extraInfo}</div></div>`;
        }
      }

      h += `</div>`;
      area.innerHTML = h;
      updateNav();
    }

    // ===== 答题处理 =====
    function pickChoice(k, gi) {
      if (record[gi]) return;
      save(gi, k, k === ALL[gi].answer);
    }

    function save(gi, chosen, correct) {
      if (record[gi]) return;
      record[gi] = { chosen, correct };
      if (correct) nCorrect++; else { nWrong++; wrongs.add(gi); }
      stats();
      saveProgress();
      render();

      // 答题后，顺滑微调滚动位置确保下一题露出
      setTimeout(() => {
        const nav = document.querySelector('.nav');
        if (nav) {
          window.scrollBy({ top: 150, left: 0, behavior: 'smooth' });
        }
      }, 100);
    }

    // ===== 清除指定类型已答记录 =====
    function confirmClearType(f, label) {
      let targetList;
      if (f === 'wrong') targetList = ALL.filter((_, i) => wrongs.has(i));
      else if (f === 'done') targetList = ALL.filter((_, i) => record[i]);
      else if (f === 'family') {
        targetList = curFamily === 'all'
          ? ALL.filter(q => q.type === 'family')
          : ALL.filter(q => q.type === 'family' && q.family === curFamily);
      } else if (f === 'cloze50') {
        targetList = curSubFilter === 'all'
          ? ALL.filter(q => q.type === 'cloze50')
          : ALL.filter(q => q.type === 'cloze50' && (q.category || '').includes(curSubFilter));
      } else if (f === 'attitude') {
        targetList = curSubFilter === 'all'
          ? ALL.filter(q => q.type === 'attitude')
          : ALL.filter(q => q.type === 'attitude' && (q.category || '').includes(curSubFilter));
      } else {
        targetList = ALL.filter(q => q.type === f);
      }

      const answeredInType = targetList.filter(q => record[ALL.indexOf(q)]);
      document.getElementById('dialogRoot').innerHTML = `
    <div class="dialog-overlay" onclick="if(event.target===this)closeDialog()">
      <div class="dialog-box">
        <div class="dialog-title">清空${label}已答记录</div>
        <div class="dialog-desc">确定要清除${label}中全部 ${answeredInType.length} 道已答记录吗？这些题目将恢复为未作答状态。</div>
        <div class="dialog-actions">
          <button class="btn-cancel" onclick="closeDialog()">取消</button>
          <button class="btn-danger" onclick="doClearType('${f}')">确认清除</button>
        </div>
      </div>
    </div>`;
    }

    function doClearType(f) {
      let targetList;
      if (f === 'wrong') targetList = ALL.filter((_, i) => wrongs.has(i));
      else if (f === 'done') targetList = ALL.filter((_, i) => record[i]);
      else if (f === 'family') {
        targetList = curFamily === 'all'
          ? ALL.filter(q => q.type === 'family')
          : ALL.filter(q => q.type === 'family' && q.family === curFamily);
      } else if (f === 'cloze50') {
        targetList = curSubFilter === 'all'
          ? ALL.filter(q => q.type === 'cloze50')
          : ALL.filter(q => q.type === 'cloze50' && (q.category || '').includes(curSubFilter));
      } else if (f === 'attitude') {
        targetList = curSubFilter === 'all'
          ? ALL.filter(q => q.type === 'attitude')
          : ALL.filter(q => q.type === 'attitude' && (q.category || '').includes(curSubFilter));
      } else {
        targetList = ALL.filter(q => q.type === f);
      }

      for (const q of targetList) {
        const gi = ALL.indexOf(q);
        if (record[gi]) {
          if (record[gi].correct) nCorrect--; else { nWrong--; wrongs.delete(gi); }
          delete record[gi];
        }
      }
      stats();
      saveProgress();
      closeDialog();
      apply(curFilter);
    }

    // ===== 重置全部进度 =====
    function confirmResetAll() {
      document.getElementById('dialogRoot').innerHTML = `
    <div class="dialog-overlay" onclick="if(event.target===this)closeDialog()">
      <div class="dialog-box">
        <div class="dialog-title">重置全部进度</div>
        <div class="dialog-desc">确定要清空所有刷题记录吗？此操作不可恢复。</div>
        <div class="dialog-actions">
          <button class="btn-cancel" onclick="closeDialog()">取消</button>
          <button class="btn-danger" onclick="doResetAll()">确认重置</button>
        </div>
      </div>
    </div>`;
    }

    function doResetAll() {
      record = {};
      wrongs.clear();
      nCorrect = 0;
      nWrong = 0;
      idx = 0;
      stats();
      saveProgress();
      closeDialog();
      apply(curFilter);
    }

    function closeDialog() {
      document.getElementById('dialogRoot').innerHTML = '';
    }

    // ===== 导航 =====
    function go(d) {
      idx += d;
      idx = Math.max(0, Math.min(idx, filtered.length - 1));
      saveProgress();
      render();
      const cardArea = document.getElementById('cardArea');
      if (cardArea) {
        const topPos = cardArea.getBoundingClientRect().top + window.scrollY - 20;
        window.scrollTo({ top: topPos, behavior: 'smooth' });
      }
    }

    function updateNav() {
      const n = filtered.length;
      document.getElementById('btnPrev').disabled = idx <= 0;
      document.getElementById('btnNext').disabled = idx >= n - 1;
      document.getElementById('navPos').textContent = n ? `${idx + 1} / ${n}` : '0 / 0';
      document.getElementById('pBar').style.width = n ? `${(idx + 1) / n * 100}%` : '0%';
    }

    function stats() {
      document.getElementById('sAnswered').textContent = nCorrect + nWrong;
      document.getElementById('sCorrect').textContent = nCorrect;
      document.getElementById('sWrong').textContent = nWrong;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ===== 快捷键 =====
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === 'ArrowRight') go(1);
      else if ('abcdABCD'.includes(e.key) && filtered[idx]?.options) {
        const gi = ALL.indexOf(filtered[idx]);
        if (!record[gi]) pickChoice(e.key.toUpperCase(), gi);
      }
    });
  </script>
</body>

</html>
