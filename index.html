<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>考研英语词汇</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* 柔和的深青色/石板灰主题 */
      --bg-base: #0f172a;
      /* slate-900 */
      --bg-card: rgba(30, 41, 59, 0.7);
      /* slate-800 with opacity for glass effect */
      --bg-elevated: rgba(51, 65, 85, 0.6);
      /* slate-700 */
      --bg-option: rgba(51, 65, 85, 0.4);
      --bg-option-hover: rgba(71, 85, 105, 0.5);
      /* slate-600 */
      --border: rgba(71, 85, 105, 0.4);
      --border-hover: rgba(100, 116, 139, 0.5);
      /* slate-500 */

      --text-primary: #f8fafc;
      /* slate-50 */
      --text-secondary: #cbd5e1;
      /* slate-300 */
      --text-muted: #94a3b8;
      /* slate-400 */

      /* 强调色：青色/薄荷绿，护眼且清晰 */
      --accent: #14b8a6;
      /* teal-500 */
      --accent-light: #5eead4;
      /* teal-300 */
      --accent-dark: #0d9488;
      /* teal-600 */
      --accent-glow: rgba(20, 184, 166, 0.15);

      /* 反馈色 */
      --correct: #10b981;
      /* emerald-500 */
      --correct-bg: rgba(16, 185, 129, 0.1);
      --correct-border: rgba(16, 185, 129, 0.3);

      --wrong: #f43f5e;
      /* rose-500 */
      --wrong-bg: rgba(244, 63, 94, 0.1);
      --wrong-border: rgba(244, 63, 94, 0.3);

      --radius: 16px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 极简氛围背景 ===== */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 0%, rgba(20, 184, 166, 0.05) 0%, transparent 70%);
    }

    .ambient::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      bottom: -50%;
      left: 0;
      background: radial-gradient(circle at 50% 100%, rgba(14, 165, 233, 0.03) 0%, transparent 60%);
    }

    /* 磨砂质感噪点 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* ===== 布局 ===== */
    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px;
      padding-bottom: 60px;
    }

    /* ===== 头部 ===== */
    .header {
      text-align: center;
      padding: 48px 0 32px;
    }

    .header-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 8px 24px rgba(20, 184, 166, 0.2);
      color: white;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-primary);
    }

    .header .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 400;
    }

    /* ===== 统计卡片 ===== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 12px;
      text-align: center;
      transition: var(--transition);
    }

    .stat-card:hover {
      border-color: var(--border-hover);
      background: rgba(30, 41, 59, 0.9);
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      line-height: 1;
    }

    .stat-value.val-total {
      color: var(--text-primary);
    }

    .stat-value.val-correct {
      color: var(--correct);
    }

    .stat-value.val-wrong {
      color: var(--wrong);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    /* ===== 筛选栏 ===== */
    .filter-scroll {
      margin-bottom: 24px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      padding: 2px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      flex-shrink: 0;
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      white-space: nowrap;
      user-select: none;
    }

    .pill:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
      background: var(--bg-elevated);
    }

    .pill.active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* ===== 题目卡片 ===== */
    .q-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      animation: slideUp 0.4s ease-out;
      position: relative;
      overflow: hidden;
    }

    .q-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #0ea5e9, var(--accent));
      opacity: 0.8;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .q-tag {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .tag-cloze50 {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .tag-attitude {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .tag-basic {
      background: rgba(14, 165, 233, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(14, 165, 233, 0.3);
    }

    .tag-advanced {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .tag-family {
      background: rgba(20, 184, 166, 0.15);
      color: var(--accent-light);
      border: 1px solid rgba(20, 184, 166, 0.3);
    }

    .q-counter {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .q-text {
      font-size: 1.1rem;
      line-height: 1.8;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 28px;
    }

    /* ===== 选项列表 ===== */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 20px;
      background: var(--bg-option);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-primary);
      text-align: left;
    }

    .opt:hover:not(.locked) {
      border-color: var(--accent-dark);
      background: var(--bg-option-hover);
    }

    .opt:active:not(.locked) {
      transform: scale(0.99);
    }

    .opt-key {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-xs);
      background: rgba(255, 255, 255, 0.08);
      font-weight: 600;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .opt:hover:not(.locked) .opt-key {
      background: var(--accent);
      color: #fff;
    }

    /* 选项反馈状态 */
    .opt.is-correct {
      border-color: var(--correct-border);
      background: var(--correct-bg);
    }

    .opt.is-correct .opt-key {
      background: var(--correct);
      color: #fff;
    }

    .opt.is-wrong {
      border-color: var(--wrong-border);
      background: var(--wrong-bg);
    }

    .opt.is-wrong .opt-key {
      background: var(--wrong);
      color: #fff;
    }

    .opt.locked {
      cursor: default;
      pointer-events: none;
    }

    .opt.locked:not(.is-correct):not(.is-wrong) {
      opacity: 0.5;
    }

    /* ===== 词族二级筛选条 ===== */
    .sub-filter-scroll {
      margin-bottom: 20px;
      animation: fadeIn 0.25s ease;
    }

    .sub-filter-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2px;
    }

    .sub-pill {
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.5);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      font-family: inherit;
    }

    .sub-pill:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
      background: var(--bg-elevated);
    }

    .sub-pill.active {
      background: rgba(20, 184, 166, 0.18);
      color: var(--accent-light);
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* ===== 反馈结果区 ===== */
    .result {
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      line-height: 1.6;
      animation: slideUp 0.3s ease-out;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .result-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      line-height: 1.5;
    }

    .result-body {
      font-size: 0.9rem;
      flex: 1;
    }
    .answer-word {
      margin-top: 8px;
      font-size: 0.88rem;
      color: var(--text-primary);
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.6;
    }
    .answer-word b {
      color: var(--accent-light);
      font-style: italic;
      font-size: 0.95rem;
      margin-right: 6px;
    }
    .answer-detail-row {
      margin-top: 6px;
      font-size: 0.82rem;
      line-height: 1.5;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.22);
    }
    .answer-phrase {
      color: #7dd3fc;
      border-left: 2px solid #0284c7;
    }
    .answer-family {
      color: #a7f3d0;
      border-left: 2px solid #059669;
    }
    .answer-tip {
      color: #f472b6;
      border-left: 2px solid #e11d48;
    }
    .answer-mnemonic {
      color: #fde047;
      border-left: 2px solid #ca8a04;
    }
    .answer-cite {
      color: #94a3b8;
      border-left: 2px solid #64748b;
      font-style: italic;
    }

    .result.r-correct {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
      color: #6ee7b7;
    }

    .result.r-wrong {
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
      color: #fda4af;
    }

    .answer-text {
      display: block;
      color: var(--text-primary);
      font-weight: 500;
      margin-top: 6px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* ===== 底部导航 ===== */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      gap: 16px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .nav-btn:hover:not(:disabled) {
      color: var(--text-primary);
      border-color: var(--border-hover);
      background: var(--bg-elevated);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
    }

    .nav-pos {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 进度条 */
    .progress {
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* ===== 空状态 ===== */
    .empty {
      text-align: center;
      padding: 64px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
    }

    .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
      display: block;
      opacity: 0.8;
    }

    .empty-text {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ===== 清除错题按钮 ===== */
    .clear-wrong-bar {
      text-align: right;
      margin-bottom: 16px;
      animation: slideUp 0.3s ease;
    }

    .clear-wrong-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .clear-wrong-btn:hover {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong);
    }

    /* ===== 确认弹窗 ===== */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
      padding: 20px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .dialog-box {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      animation: dialogPop 0.25s ease;
    }

    @keyframes dialogPop {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .dialog-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .dialog-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .dialog-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .dialog-actions button {
      padding: 10px 20px;
      border-radius: var(--radius-xs);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .btn-cancel:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .btn-danger {
      background: var(--wrong);
      border: 1px solid var(--wrong);
      color: #fff;
    }

    .btn-danger:hover {
      background: #e11d48;
      border-color: #e11d48;
    }

    /* ===== 移动端适配 ===== */
    @media (max-width: 480px) {
      .app {
        padding: 0 16px;
        padding-bottom: 40px;
      }

      .header {
        padding: 32px 0 24px;
      }

      .header h1 {
        font-size: 1.4rem;
      }

      .q-card {
        padding: 24px 20px;
      }

      .q-text {
        font-size: 1rem;
        margin-bottom: 24px;
      }

      .stat-value {
        font-size: 1.3rem;
      }

      .nav-btn {
        padding: 10px 16px;
        font-size: 0.8rem;
      }

      .filter-row {
        justify-content: flex-start;
      }

      .clear-wrong-btn {
        padding: 6px 12px;
        font-size: 0.8rem;
      }
    }

    }

    /* ===== 闯关模式按钮 ===== */
    .challenge-entry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 12px 28px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.5px;
    }
    .challenge-entry-btn:hover {
      opacity: 0.9;
    }

    /* ===== 闯关模式覆盖层 ===== */
    .challenge-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: #080f1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }
    .challenge-overlay.hidden { display: none; }

    /* 顶部HUD */
    .ch-hud {
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 0;
      flex-shrink: 0;
    }
    .ch-exit-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .ch-exit-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .ch-level-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(251,191,36,0.12);
      border: 1px solid rgba(251,191,36,0.3);
      padding: 6px 16px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 1px;
    }
    .ch-lives {
      display: flex;
      gap: 5px;
      font-size: 1.3rem;
    }
    .ch-heart {
      transition: all 0.3s;
      filter: drop-shadow(0 0 4px rgba(244,63,94,0.6));
    }
    .ch-heart.lost {
      filter: grayscale(1);
      opacity: 0.3;
      transform: scale(0.8);
    }

    /* 连击条 */
    .ch-combo-bar {
      width: 100%;
      max-width: 640px;
      padding: 14px 20px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

<body>
  <div class="ambient"></div>
  <div class="app">

    <div class="header">
      <div class="header-icon">📖</div>
      <h1>考研英语词汇</h1>

  <script>
    // ===== 状态管理 =====
    // ===== 状态管理 =====
    let ALL = [], filtered = [], idx = 0;
    let record = {};  // globalIdx -> { chosen, correct }
    let wrongs = new Set();
    let nCorrect = 0, nWrong = 0;
    let curFilter = 'all';
    let curFamily = 'all';
    let curSubFilter = 'all';

    // ===== SRS state =====
    let srsData = {};
    const SRS_KEY = 'quiz_srs_v1';

    const STORAGE_KEY = 'quiz_en_v1';

    // ===== 初始化 =====
    fetch('questions_english.json').then(r => r.json()).then(d => {
      ALL = d;
      document.getElementById('total').textContent = d.length;
      loadProgress();
      apply(curFilter);
    }).catch(e => {
      document.getElementById('cardArea').innerHTML = '<div class="empty"><div class="empty-text">题库加载失败</div></div>';
    });

    // ===== SRS Functions =====
    function loadSRS() {
      try {
        const raw = localStorage.getItem(SRS_KEY);
        if (raw) srsData = JSON.parse(raw);
      } catch(e) { srsData = {}; }
      updateSrsOwnedDisplay();
    }

    function saveSRS() {
      try {
        localStorage.setItem(SRS_KEY, JSON.stringify(srsData));
      } catch(e) {}
    }

    function getSRSState(gi) {
      return srsData[gi] || { stage: 0, interval: 0, dueDate: 0, reps: 0 };
    }

    function updateSRS(gi, isCorrect) {
      let st = getSRSState(gi);
      const now = Date.now();
      const ONE_DAY = 86400000;
      if (isCorrect) {
        st.reps = (st.reps || 0) + 1;
        if (st.stage === 0) { st.stage = 1; st.interval = 1; }
        else if (st.stage === 1) { st.stage = 2; st.interval = 3; }
        else if (st.stage === 2) { st.stage = 3; st.interval = 7; }
        else if (st.stage === 3) { st.stage = 4; st.interval = 15; }
        else { st.stage = 5; st.interval = 30; }
        st.dueDate = now + st.interval * ONE_DAY;
      } else {
        st.stage = Math.max(0, st.stage - 1);
        st.interval = 0;
        st.dueDate = now;
      }
      srsData[gi] = st;
      saveSRS();
      updateSrsOwnedDisplay();
    }

    function isDueToday(gi) {
      const st = srsData[gi];
      if (!st) return false;
      const now = Date.now();
      return st.dueDate && st.dueDate <= now;
    }

    function updateSrsOwnedDisplay() {
      let ownedCount = 0;
      Object.values(srsData).forEach(st => {
        if (st.stage >= 5 || (st.stage >= 3 && st.interval >= 7)) ownedCount++;
      });
      const el = document.getElementById('srsOwned');
      if (el) el.textContent = ownedCount;
    }

    // ===== localStorage 持久化 =====
    function saveProgress() {
      try {
        const data = {
          record,
          wrongs: [...wrongs],
          nCorrect,
          nWrong,
          idx,
          curFilter,
          curFamily,
          curSubFilter
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        saveSRS();
      } catch (e) { /* quota exceeded or private mode, silently ignore */ }
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        record = data.record || {};
        wrongs = new Set(data.wrongs || []);
        nCorrect = data.nCorrect || 0;
        nWrong = data.nWrong || 0;
        idx = data.idx || 0;
        curFilter = data.curFilter || 'all';
        curFamily = data.curFamily || 'all';
        curSubFilter = data.curSubFilter || 'all';

        loadSRS();

        // 兼容迁移旧分类
        if (['choice', 'judge', 'fill'].includes(curFilter)) {
          curFilter = 'all';
        }

        // restore filter pill active state
        document.querySelectorAll('.pill:not([onclick])').forEach(b => {
          b.classList.toggle('active', b.dataset.f === curFilter);
        });
        stats();
      } catch (e) { /* corrupt data, start fresh */ }
    }

    // ===== 二级子筛选条动态渲染 =====
    function renderSubFilterBar() {
      const subRow = document.getElementById('subFamilyRow');
      const bar = document.getElementById('familyBar');

      if (curFilter === 'family') {
        subRow.style.display = 'block';
        const famOrder = ['act', 'tract', 'spect', 'form', 'port', 'dict', 'press', 'ex', 're', 'in', 'con', 'pos', 'auto', 'ten/tain', 'vis/vid', 'cept/ceive', 'grad/gress', 'duc/duct'];
        const famSet = [];
        famOrder.forEach(f => {
          if (ALL.some(q => q.type === 'family' && q.family === f)) famSet.push(f);
        });
        ALL.forEach(q => {
          if (q.type === 'family' && q.family && !famSet.includes(q.family)) {
            famSet.push(q.family);
          }
        });

        const totalFamilyCount = ALL.filter(q => q.type === 'family').length;
        let h = `<button class="sub-pill ${curFamily === 'all' ? 'active' : ''}" onclick="pickFamily('all')">全部家族 (${totalFamilyCount})</button>`;
        famSet.forEach(f => {
          const cnt = ALL.filter(q => q.type === 'family' && q.family === f).length;
          h += `<button class="sub-pill ${curFamily === f ? 'active' : ''}" onclick="pickFamily('${f}')">${f} 家族 (${cnt})</button>`;
        });
        bar.innerHTML = h;
      } else if (curFilter === 'cloze50') {
        subRow.style.display = 'block';
        const cats = [
          { key: 'all', label: '全部完形' },
          { key: '一级红花', label: '一级红花 (100%)' },
          { key: '二级红花', label: '二级红花 (>70%)' },
          { key: '绿叶词', label: '绿叶词 (干扰项)' }
        ];
        let h = '';
        cats.forEach(c => {
          const cnt = c.key === 'all'
            ? ALL.filter(q => q.type === 'cloze50').length
            : ALL.filter(q => q.type === 'cloze50' && (q.category || '').includes(c.key)).length;
          h += `<button class="sub-pill ${curSubFilter === c.key ? 'active' : ''}" onclick="pickSubFilter('${c.key}')">${c.label} (${cnt})</button>`;
        });
        bar.innerHTML = h;
      } else if (curFilter === 'attitude') {
        subRow.style.display = 'block';
        const cats = [
          { key: 'all', label: '全部态度' },
          { key: '正态度', label: '正态度 (赞同)' },
          { key: '负态度', label: '负态度 (批判/怀疑)' },
          { key: '中立态度', label: '中立态度 (客观)' },
          { key: '不可选', label: '不可选干扰项' }
        ];
        let h = '';
        cats.forEach(c => {
          const cnt = c.key === 'all'
            ? ALL.filter(q => q.type === 'attitude').length
            : ALL.filter(q => q.type === 'attitude' && (q.category || '').includes(c.key)).length;
          h += `<button class="sub-pill ${curSubFilter === c.key ? 'active' : ''}" onclick="pickSubFilter('${c.key}')">${c.label} (${cnt})</button>`;
        });
        bar.innerHTML = h;
      } else {
        subRow.style.display = 'none';
      }
    }

    function pickFamily(fam) {
      curFamily = fam;
      renderSubFilterBar();
      apply('family');
    }

    function pickSubFilter(sub) {
      curSubFilter = sub;
      renderSubFilterBar();
      apply(curFilter);
    }

    // ===== 主筛选逻辑 =====
    document.getElementById('filterRow').addEventListener('click', e => {
      const btn = e.target.closest('.pill');
      if (!btn || btn.hasAttribute('onclick')) return; // ignore reset button
      document.querySelectorAll('.pill:not([onclick])').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.f;
      curFilter = f;
      curSubFilter = 'all';
      if (f === 'shuffle') {
        renderSubFilterBar();
        filtered = [...ALL].sort(() => Math.random() - 0.5);
        idx = 0;
        render();
      } else {
        apply(f);
      }
    });

    function apply(f) {
      curFilter = f;
      renderSubFilterBar();

      if (f === 'all') filtered = [...ALL];
      else if (f === 'wrong') filtered = ALL.filter((_, i) => wrongs.has(i));
      else if (f === 'done') filtered = ALL.filter((_, i) => record[i]);
      else if (f === 'today') {
        const now = Date.now();
        const due = ALL.filter((_, gi) => { const s = srsData[gi]; return s && s.stage > 0 && s.dueDate && s.dueDate <= now; });
        const fresh = ALL.filter((_, gi) => { const s = srsData[gi]; return !s || s.stage === 0; }).slice(0, 20);
        filtered = [...due, ...fresh];
      }
      else if (f === 'family') {
        if (curFamily === 'all') filtered = ALL.filter(q => q.type === 'family');
        else filtered = ALL.filter(q => q.type === 'family' && q.family === curFamily);
      } else if (f === 'cloze50') {
        if (curSubFilter === 'all') filtered = ALL.filter(q => q.type === 'cloze50');
        else filtered = ALL.filter(q => q.type === 'cloze50' && (q.category || '').includes(curSubFilter));
      } else if (f === 'attitude') {
        if (curSubFilter === 'all') filtered = ALL.filter(q => q.type === 'attitude');
        else filtered = ALL.filter(q => q.type === 'attitude' && (q.category || '').includes(curSubFilter));
      } else {
        filtered = ALL.filter(q => q.type === f);
      }

      // 自动定位到当前分类下第一道【未作答】的题目
      const firstUnanswered = filtered.findIndex(q => !record[ALL.indexOf(q)]);
      idx = firstUnanswered !== -1 ? firstUnanswered : 0;

      render();
    }

    // ===== 渲染页面 =====
    function render() {
      const area = document.getElementById('cardArea');
      const clearBar = document.getElementById('clearBar');

      // 清理按钮
      const typeLabels = {
        cloze50: '完形50词',
        attitude: '态度词',
        family: '家族题',
        basic: '基础题',
        advanced: '进阶题',
        done: '已答',
        wrong: '错题'
      };
      const hasAnsweredInFilter = filtered.some(q => record[ALL.indexOf(q)]);
      if (['wrong', 'cloze50', 'attitude', 'family', 'basic', 'advanced', 'done'].includes(curFilter) && hasAnsweredInFilter) {
        let label = typeLabels[curFilter] || '';
        if (curFilter === 'family' && curFamily !== 'all') {
          label = `${curFamily} 家族`;
        } else if (curFilter === 'cloze50' && curSubFilter !== 'all') {
          label = curSubFilter;
        } else if (curFilter === 'attitude' && curSubFilter !== 'all') {
          label = curSubFilter;
        }
        clearBar.innerHTML = `<div class="clear-wrong-bar">
      <button class="clear-wrong-btn" onclick="confirmClearType('${curFilter}','${label}')">
        <svg style="width:14px;height:14px;margin-bottom:1px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        清空${label}已答记录
      </button>
    </div>`;
      } else {
        clearBar.innerHTML = '';
      }

      if (!filtered.length) {
        area.innerHTML = `<div class="empty">
      <span class="empty-icon">${curFilter === 'wrong' ? '🎉' : '📭'}</span>
      <div class="empty-text">${curFilter === 'wrong' ? '太棒了，目前没有错题！' : '该分类下暂无题目'}</div>
    </div>`;
        updateNav();
        return;
      }

      const q = filtered[idx];
      const gi = ALL.indexOf(q);

      let tagCls = 'tag-basic', tagText = '基础题';
      if (q.type === 'advanced') {
        tagCls = 'tag-advanced';
        tagText = '进阶题';
      } else if (q.type === 'family') {
        tagCls = 'tag-family';
        tagText = `词族 · ${q.family || '核心'} 家族`;
      } else if (q.type === 'cloze50') {
        tagCls = 'tag-cloze50';
        tagText = `完形 · ${q.category || '红花绿叶'}`;
      } else if (q.type === 'attitude') {
        tagCls = 'tag-attitude';
        tagText = `态度 · ${q.category || '阅读态度'}`;
      }

      const done = record[gi];

      let h = `<div class="q-card">
    <div class="q-meta">
      <span class="q-tag ${tagCls}">${tagText}</span>
      <span class="q-counter">${idx + 1} / ${filtered.length}</span>
    </div>
    <div class="q-text">${esc(q.question)}</div>`;

      if (q.options) {
        h += `<div class="options-list">`;
        for (const [k, v] of Object.entries(q.options)) {
          let c = done ? 'locked' : '';
          if (done && k === q.answer) c += ' is-correct';
          if (done && done.chosen === k && !done.correct) c += ' is-wrong';
          h += `<button class="opt ${c}" onclick="pickChoice('${k}',${gi})">
        <span class="opt-key">${k}</span><span class="opt-label">${esc(v)}</span>
      </button>`;
        }
        h += `</div>`;
      }

      // 答案反馈与考点知识卡片
      if (done) {
        let extraInfo = '';
        if (q.word && q.meaning) {
          extraInfo += `<div class="answer-word">📖 <b>${esc(q.word)}</b> ${esc(q.meaning)}</div>`;
        }
        if (q.technique_tip) {
          extraInfo += `<div class="answer-detail-row answer-tip">${esc(q.technique_tip)}</div>`;
        }
        if (q.phrase) {
          extraInfo += `<div class="answer-detail-row answer-phrase">📌 <b>考点搭配:</b> ${esc(q.phrase)}</div>`;
        }
        if (q.mnemonic) {
          extraInfo += `<div class="answer-detail-row answer-mnemonic">${esc(q.mnemonic)}</div>`;
        }
        if (q.family_note) {
          extraInfo += `<div class="answer-detail-row answer-family">🌱 <b>家族串记:</b> ${esc(q.family_note)}</div>`;
        }
        if (q.exam_cite) {
          extraInfo += `<div class="answer-detail-row answer-cite">📖 <b>真题出处:</b> ${esc(q.exam_cite)}</div>`;
        }
        if (done.correct) {
          h += `<div class="result r-correct"><span class="result-icon">✓</span><div class="result-body">回答正确${extraInfo}</div></div>`;
        } else {
          const at = q.answer + '. ' + (q.options ? q.options[q.answer] : '');
          h += `<div class="result r-wrong"><span class="result-icon">✗</span><div class="result-body">回答错误<span class="answer-text">${esc(at)}</span>${extraInfo}</div></div>`;
        }
      }

      h += `</div>`;
      area.innerHTML = h;
      updateNav();
    }

    // ===== 答题处理 =====
    function pickChoice(k, gi) {
      if (record[gi]) return;
      save(gi, k, k === ALL[gi].answer);
    }

    function save(gi, chosen, correct) {
      if (record[gi]) return;
      record[gi] = { chosen, correct };
      if (correct) nCorrect++; else { nWrong++; wrongs.add(gi); }
      stats();
      saveProgress();
      render();

      // 答题后，顺滑微调滚动位置确保下一题露出
      setTimeout(() => {
        const nav = document.querySelector('.nav');
        if (nav) {
          window.scrollBy({ top: 150, left: 0, behavior: 'smooth' });
        }
      }, 100);
    }

    // ===== SRS 辅助函数（在 render 中调用）=====
    function getMasteryMeta(gi) {
      const s = srsData[gi];
      if (!s || s.stage === 0) return { cls: 'mastery-new', label: '新词' };
      if (s.stage <= 2) return { cls: 'mastery-learn', label: '学习中' };
      if (s.stage <= 4) return { cls: 'mastery-review', label: '复习中' };
      return { cls: 'mastery-owned', label: '⭐已掌握' };
    }

    function buildSRSHint(gi, correct) {
      const s = srsData[gi];
      if (!s) return '';
      const ONE_DAY = 86400000;
      const daysLeft = s.dueDate ? Math.ceil((s.dueDate - Date.now()) / ONE_DAY) : 0;
      let cls, icon, msg;
      if (!correct) {
        cls = 'hint-wrong'; icon = '🔄';
        msg = '重新学习 · 明天再见';
      } else if (s.stage >= 5) {
        cls = 'hint-mastered'; icon = '⭐';
        msg = `这个词你已掌握！约${daysLeft}天后再见`;
      } else if (s.stage === 1) {
        cls = 'hint-correct'; icon = '🌱';
        msg = `初次记录 · 明天复习`;
      } else {
        cls = 'hint-correct'; icon = '📈';
        const d = daysLeft <= 1 ? '明天' : daysLeft < 7 ? `${daysLeft}天后` : daysLeft < 30 ? `${Math.round(daysLeft/7)}周后` : `${Math.round(daysLeft/30)}个月后`;
        msg = `熟练度×${s.stage} · ${d}再见`;
      }
      return `<div class="srs-hint ${cls}">${icon} ${msg}</div>`;
    }

    // ===== 清除指定类型已答记录 =====
    function confirmClearType(f, label) {
      let targetList;
      if (f === 'wrong') targetList = ALL.filter((_, i) => wrongs.has(i));
      else if (f === 'done') targetList = ALL.filter((_, i) => record[i]);
      else if (f === 'family') {
        targetList = curFamily === 'all'
          ? ALL.filter(q => q.type === 'family')
          : ALL.filter(q => q.type === 'family' && q.family === curFamily);
      } else if (f === 'cloze50') {
        targetList = curSubFilter === 'all'
          ? ALL.filter(q => q.type === 'cloze50')
          : ALL.filter(q => q.type === 'cloze50' && (q.category || '').includes(curSubFilter));
      } else if (f === 'attitude') {
        targetList = curSubFilter === 'all'
          ? ALL.filter(q => q.type === 'attitude')
          : ALL.filter(q => q.type === 'attitude' && (q.category || '').includes(curSubFilter));
      } else {
        targetList = ALL.filter(q => q.type === f);
      }

      const answeredInType = targetList.filter(q => record[ALL.indexOf(q)]);
      document.getElementById('dialogRoot').innerHTML = `
    <div class="dialog-overlay" onclick="if(event.target===this)closeDialog()">
      <div class="dialog-box">
        <div class="dialog-title">清空${label}已答记录</div>
        <div class="dialog-desc">确定要清除${label}中全部 ${answeredInType.length} 道已答记录吗？这些题目将恢复为未作答状态。</div>
        <div class="dialog-actions">
          <button class="btn-cancel" onclick="closeDialog()">取消</button>
          <button class="btn-danger" onclick="doClearType('${f}')">确认清除</button>
        </div>
      </div>
    </div>`;
    }

    function doClearType(f) {
      let targetList;
      if (f === 'wrong') targetList = ALL.filter((_, i) => wrongs.has(i));
      else if (f === 'done') targetList = ALL.filter((_, i) => record[i]);
      else if (f === 'family') {
        targetList = curFamily === 'all'
          ? ALL.filter(q => q.type === 'family')
          : ALL.filter(q => q.type === 'family' && q.family === curFamily);
      } else if (f === 'cloze50') {
        targetList = curSubFilter === 'all'
          ? ALL.filter(q => q.type === 'cloze50')
          : ALL.filter(q => q.type === 'cloze50' && (q.category || '').includes(curSubFilter));
      } else if (f === 'attitude') {
        targetList = curSubFilter === 'all'
          ? ALL.filter(q => q.type === 'attitude')
          : ALL.filter(q => q.type === 'attitude' && (q.category || '').includes(curSubFilter));
      } else {
        targetList = ALL.filter(q => q.type === f);
      }

      for (const q of targetList) {
        const gi = ALL.indexOf(q);
        if (record[gi]) {
          if (record[gi].correct) nCorrect--; else { nWrong--; wrongs.delete(gi); }
          delete record[gi];
        }
      }
      stats();
      saveProgress();
      closeDialog();
      apply(curFilter);
    }

    // ===== 重置全部进度 =====
    function confirmResetAll() {
      document.getElementById('dialogRoot').innerHTML = `
    <div class="dialog-overlay" onclick="if(event.target===this)closeDialog()">
      <div class="dialog-box">
        <div class="dialog-title">重置全部进度</div>
        <div class="dialog-desc">确定要清空所有刷题记录吗？此操作不可恢复。</div>
        <div class="dialog-actions">
          <button class="btn-cancel" onclick="closeDialog()">取消</button>
          <button class="btn-danger" onclick="doResetAll()">确认重置</button>
        </div>
      </div>
    </div>`;
    }

    function doResetAll() {
      record = {};
      wrongs.clear();
      nCorrect = 0;
      nWrong = 0;
      idx = 0;
      stats();
      saveProgress();
      closeDialog();
      apply(curFilter);
    }

    function closeDialog() {
      document.getElementById('dialogRoot').innerHTML = '';
    }

    // ===== 导航 =====
    function go(d) {
      idx += d;
      idx = Math.max(0, Math.min(idx, filtered.length - 1));
      saveProgress();
      render();
      const cardArea = document.getElementById('cardArea');
      if (cardArea) {
        const topPos = cardArea.getBoundingClientRect().top + window.scrollY - 20;
        window.scrollTo({ top: topPos, behavior: 'smooth' });
      }
    }

    function updateNav() {
      const n = filtered.length;
      document.getElementById('btnPrev').disabled = idx <= 0;
      document.getElementById('btnNext').disabled = idx >= n - 1;
      document.getElementById('navPos').textContent = n ? `${idx + 1} / ${n}` : '0 / 0';
      document.getElementById('pBar').style.width = n ? `${(idx + 1) / n * 100}%` : '0%';
    }

    function stats() {
      document.getElementById('sAnswered').textContent = nCorrect + nWrong;
      document.getElementById('sCorrect').textContent = nCorrect;
      document.getElementById('sWrong').textContent = nWrong;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ===== 快捷键 =====
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (!chActive) {
        if (e.key === 'ArrowLeft') go(-1);
        else if (e.key === 'ArrowRight') go(1);
        else if ('abcdABCD'.includes(e.key) && filtered[idx]?.options) {
          const gi = ALL.indexOf(filtered[idx]);
          if (!record[gi]) pickChoice(e.key.toUpperCase(), gi);
        }
      } else {
        if ('abcdABCD'.includes(e.key) && chActive && !chAnswered) {
          chPick(e.key.toUpperCase());
        }
      }
    });

    // ============================================================
    // ===== 闯关模式 CHALLENGE MODE =====
    // ============================================================
    const LEVEL_SIZE = 10;         // 每关题数
    const MAX_LIVES = 3;           // 生命值上限
    const COMBO_FIRE = 3;          // 连击达到几次触发火焰
    const QUESTION_TIME = 9999;   // 不限时
    const TIMEOUT_PENALTY = false; // 不超时惩罚，专注记单词超时算错

    let chActive = false;
    let chPool = [];      // 本次闯关题池（打乱后的ALL）
    let chLevel = 1;
    let chLevelStart = 0; // 当前关卡在chPool中的起始索引
    let chQIdx = 0;       // 当前关卡内题目索引(0~LEVEL_SIZE-1)
    let chLives = MAX_LIVES;
    let chCombo = 0;
    let chMaxCombo = 0;
    let chLevelCorrect = 0;
    let chLevelWrong = 0;
    let chAnswered = false;
    let chTimerVal = QUESTION_TIME;
    let chTimerInterval = null;
    let chTotalCorrect = 0;
    let chTotalWrong = 0;

    function startChallenge() {
      // 打乱ALL作为题池
      chPool = [...ALL].sort(() => Math.random() - 0.5);
      chLevel = 1;
      chLevelStart = 0;
      chLives = MAX_LIVES;
      chCombo = 0;
      chMaxCombo = 0;
      chTotalCorrect = 0;
      chTotalWrong = 0;
      chActive = true;
      document.getElementById('challengeOverlay').classList.remove('hidden');
      document.getElementById('chResultScreen').classList.add('hidden');
      document.getElementById('chGameover').classList.add('hidden');
      chStartLevel();
    }

    function chStartLevel() {
      chQIdx = 0;
      chLevelCorrect = 0;
      chLevelWrong = 0;
      renderChHUD();
      chShowQuestion();
    }

    function chShowQuestion() {
      chAnswered = false;
      const gIdx = chLevelStart + chQIdx;
      if (gIdx >= chPool.length) {
        // 题库耗尽，循环
        chPool = [...chPool, ...ALL.sort(() => Math.random() - 0.5)];
      }
      const q = chPool[gIdx % chPool.length];
      renderChCard(q);
      chStartTimer();
    }

    function renderChHUD() {
      // 关卡徽章
      document.getElementById('chLevelBadge').textContent = `LEVEL ${chLevel}`;
      // 生命值
      let livesHTML = '';
      for (let i = 0; i < MAX_LIVES; i++) {
        livesHTML += `<span class="ch-heart${i >= chLives ? ' lost' : ''}">❤️</span>`;
      }
      document.getElementById('chLives').innerHTML = livesHTML;
      // 连击
      updateComboUI();
    }

    function updateComboUI() {
      const dots = document.getElementById('chComboDots');
      const label = document.getElementById('chComboLabel');
      const count = document.getElementById('chComboCount');
      const isFire = chCombo >= COMBO_FIRE;
      label.textContent = isFire ? '🔥 COMBO' : 'COMBO';
      label.className = 'ch-combo-label' + (isFire ? ' on-fire' : '');
      count.textContent = `×${chCombo}`;
      count.style.color = isFire ? '#f59e0b' : '#64748b';
      let h = '';
      for (let i = 0; i < LEVEL_SIZE; i++) {
        const filled = i < chQIdx;
        // determine if this dot was correct or wrong
        const dotFire = filled && (chCombo >= COMBO_FIRE);
        h += `<div class="ch-dot${filled ? ' filled' + (dotFire ? ' fire' : '') : ''}"></div>`;
      }
      dots.innerHTML = h;
    }

    function renderChCard(q) {
      let tagCls = 'tag-basic', tagText = '基础题';
      if (q.type === 'advanced') { tagCls = 'tag-advanced'; tagText = '进阶题'; }
      else if (q.type === 'family') { tagCls = 'tag-family'; tagText = `${q.family || '核心'} 家族`; }
      else if (q.type === 'cloze50') { tagCls = 'tag-cloze50'; tagText = '完形50词'; }
      else if (q.type === 'attitude') { tagCls = 'tag-attitude'; tagText = '态度词'; }

      // SRS掌握状态补丁
      const gi = ALL.indexOf(q);
      const mm = gi >= 0 ? getMasteryMeta(gi) : { cls: 'mastery-new', label: '新词' };

      let optHTML = '';
      if (q.options) {
        for (const [k, v] of Object.entries(q.options)) {
          optHTML += `<button class="ch-opt" id="chOpt_${k}" onclick="chPick('${k}')">
            <span class="ch-opt-key">${k}</span><span>${esc(v)}</span>
          </button>`;
        }
      }

      const innerQ = chQIdx + 1;
      document.getElementById('chCardWrap').innerHTML = `
        <div class="ch-q-card" id="chQCard">
          <div class="ch-progress-text" style="display:flex;align-items:center;justify-content:space-between">
            <span>第 ${innerQ} / ${LEVEL_SIZE} 题 &nbsp;·&nbsp; 本关正确 ${chLevelCorrect} 题</span>
            <span class="mastery-chip ${mm.cls}" style="font-size:0.65rem">${mm.label}</span>
          </div>
          <div class="ch-q-tag ${tagCls}">${tagText}</div>
          <div class="ch-q-text">${esc(q.question)}</div>
          <div class="ch-opts" id="chOpts">${optHTML}</div>
          <div id="chFeedback"></div>
        </div>`;
    }

    function chPick(k) {
      if (chAnswered) return;
      chAnswered = true;
      clearInterval(chTimerInterval);

      const gIdx = (chLevelStart + chQIdx) % chPool.length;
      const q = chPool[gIdx];
      const correct = k === q.answer;
      const gi = ALL.indexOf(q); // global index for SRS

      // 锁定所有选项
      document.querySelectorAll('.ch-opt').forEach(btn => btn.classList.add('locked'));
      const picked = document.getElementById('chOpt_' + k);
      const rightBtn = document.getElementById('chOpt_' + q.answer);
      if (picked) picked.classList.add(correct ? 'correct' : 'wrong-ans');
      if (!correct && rightBtn) rightBtn.classList.add('correct');

      // 更新SRS熱练度
      if (gi >= 0) updateSRS(gi, correct);

      // 更新闯关状态
      if (correct) {
        chCombo++;
        chMaxCombo = Math.max(chMaxCombo, chCombo);
        chLevelCorrect++;
        chTotalCorrect++;
        spawnParticles(true);
        if (chCombo >= COMBO_FIRE) showComboPopup(chCombo);
      } else {
        chCombo = 0;
        chLevelWrong++;
        chTotalWrong++;
        chLives--;
        spawnParticles(false);
        renderChHUD();
        if (chLives <= 0) {
          setTimeout(() => showGameover(), 1200);
          showFeedback(q, gi, correct);
          return;
        }
      }
      updateComboUI();
      showFeedback(q, gi, correct);
    }

    function showFeedback(q, gi, correct) {
      let extra = '';
      if (q.word && q.meaning) extra += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.07);font-size:0.83rem">📖 <b style="color:#5eead4;font-style:italic">${esc(q.word)}</b> ${esc(q.meaning)}</div>`;
      if (q.technique_tip) extra += `<div style="margin-top:6px;font-size:0.8rem;color:#f472b6">💡 ${esc(q.technique_tip)}</div>`;
      if (q.phrase) extra += `<div style="margin-top:4px;font-size:0.8rem;color:#7dd3fc">📌 ${esc(q.phrase)}</div>`;
      if (q.family_note) extra += `<div style="margin-top:4px;font-size:0.8rem;color:#a7f3d0">🌱 ${esc(q.family_note)}</div>`;
      // SRS 熟练度提示 —— 闯关模式上瘾感核心
      if (gi >= 0) extra += buildSRSHint(gi, correct);

      const fb = document.getElementById('chFeedback');
      if (correct) {
        fb.innerHTML = `<div class="ch-feedback fb-correct">✓ 回答正确！${extra}</div><button class="ch-next-btn" onclick="chNext()">下一题 →</button>`;
      } else {
        const at = q.answer + '. ' + (q.options ? q.options[q.answer] : '');
        fb.innerHTML = `<div class="ch-feedback fb-wrong">✗ 回答错误 &nbsp;<span style="background:rgba(0,0,0,0.2);padding:3px 10px;border-radius:6px;font-weight:600">${esc(at)}</span>${extra}</div><button class="ch-next-btn" style="background:linear-gradient(135deg,#f43f5e,#8b5cf6)" onclick="chNext()">继续 →</button>`;
      }
    }

    function chNext() {
      chQIdx++;
      if (chQIdx >= LEVEL_SIZE) {
        // 关卡结算
        clearInterval(chTimerInterval);
        showLevelResult();
      } else {
        chShowQuestion();
      }
    }

    // ===== 倒计时 =====
    function chStartTimer() {
      chTimerVal = QUESTION_TIME;
      clearInterval(chTimerInterval);
      updateTimerUI();
      chTimerInterval = setInterval(() => {
        chTimerVal--;
        updateTimerUI();
        if (chTimerVal <= 0) {
          clearInterval(chTimerInterval);
          if (!chAnswered && TIMEOUT_PENALTY) {
            // 超时自动答错
            const gIdx = (chLevelStart + chQIdx) % chPool.length;
            const q = chPool[gIdx];
            const gi = ALL.indexOf(q);
            chAnswered = true;
            chCombo = 0;
            chLevelWrong++;
            chTotalWrong++;
            chLives--;
            if (gi >= 0) updateSRS(gi, false);
            spawnParticles(false);
            updateComboUI();
            renderChHUD();
            // 显示正确答案
            document.querySelectorAll('.ch-opt').forEach(btn => btn.classList.add('locked'));
            const rightBtn = document.getElementById('chOpt_' + q.answer);
            if (rightBtn) rightBtn.classList.add('correct');
            if (chLives <= 0) {
              setTimeout(() => showGameover(), 1200);
              showFeedback(q, gi, false);
            } else {
              showFeedback(q, gi, false);
            }
          }
        }
      }, 1000);
    }

    function updateTimerUI() {
      const pct = chTimerVal / QUESTION_TIME * 100;
      const fill = document.getElementById('chTimerFill');
      const label = document.getElementById('chTimerLabel');
      if (!fill) return;
      fill.style.width = pct + '%';
      const urgent = chTimerVal <= 8;
      fill.className = 'ch-timer-fill' + (urgent ? ' urgent' : '');
      label.className = 'ch-timer-label' + (urgent ? ' urgent' : '');
      label.textContent = chTimerVal + 's';
    }

    // ===== 关卡结算 =====
    function showLevelResult() {
      clearInterval(chTimerInterval);
      const accuracy = Math.round(chLevelCorrect / LEVEL_SIZE * 100);
      let grade, gradeClass, title, sub;
      if (accuracy === 100) { grade = 'S'; gradeClass = 'grade-s'; title = '完美闯关！'; sub = '无一失误，超越99%的对手 🏆'; }
      else if (accuracy >= 80) { grade = 'A'; gradeClass = 'grade-a'; title = '表现优秀！'; sub = `正确率 ${accuracy}%，再接再厉 💪`; }
      else if (accuracy >= 60) { grade = 'B'; gradeClass = 'grade-b'; title = '勉强过关'; sub = `正确率 ${accuracy}%，还需加油 📚`; }
      else { grade = 'C'; gradeClass = 'grade-c'; title = '差点翻车...'; sub = `正确率 ${accuracy}%，错题需要复习！`; }

      const screen = document.getElementById('chResultScreen');
      screen.className = 'ch-result-screen';
      screen.innerHTML = `
        <div class="ch-grade ${gradeClass}">${grade}</div>
        <div class="ch-result-title">${title}</div>
        <div class="ch-result-sub">第 ${chLevel} 关 · ${sub}</div>
        <div class="ch-result-stats">
          <div class="ch-rstat"><div class="ch-rstat-val green">${chLevelCorrect}</div><div class="ch-rstat-label">正确</div></div>
          <div class="ch-rstat"><div class="ch-rstat-val red">${chLevelWrong}</div><div class="ch-rstat-label">错误</div></div>
          <div class="ch-rstat"><div class="ch-rstat-val amber">${chMaxCombo}</div><div class="ch-rstat-label">最高连击</div></div>
        </div>
        <div class="ch-result-btns">
          <button class="ch-btn-next-level" onclick="chNextLevel()">🚀 继续第 ${chLevel + 1} 关</button>
          <button class="ch-btn-retry" onclick="chRetryLevel()">↻ 重打本关</button>
          <button class="ch-quit-link" onclick="exitChallenge()">退出闯关</button>
        </div>`;
      if (grade === 'S') setTimeout(() => fireConfetti(), 200);
    }

    function chNextLevel() {
      chLevel++;
      chLevelStart += LEVEL_SIZE;
      chMaxCombo = 0;
      document.getElementById('chResultScreen').classList.add('hidden');
      chStartLevel();
    }

    function chRetryLevel() {
      // 重新打乱本关题目
      const levelSlice = chPool.splice(chLevelStart, LEVEL_SIZE).sort(() => Math.random() - 0.5);
      chPool.splice(chLevelStart, 0, ...levelSlice);
      chMaxCombo = 0;
      document.getElementById('chResultScreen').classList.add('hidden');
      chStartLevel();
    }

    // ===== 游戏结束 =====
    function showGameover() {
      clearInterval(chTimerInterval);
      const screen = document.getElementById('chGameover');
      screen.className = 'ch-gameover';
      screen.innerHTML = `
        <div class="ch-gameover-icon">💀</div>
        <div class="ch-gameover-title">闯关失败</div>
        <div class="ch-gameover-sub">生命值耗尽，倒在第 ${chLevel} 关第 ${chQIdx + 1} 题<br>总计答对 ${chTotalCorrect} 题 · 最高连击 ${chMaxCombo}</div>
        <button class="ch-revive-btn" onclick="reviveFromWrong()">💖 复活 · 从错题重新出发</button>
        <button class="ch-quit-link" onclick="exitChallenge()">放弃，退出闯关</button>`;
    }

    function reviveFromWrong() {
      // 复活：重置生命，重新从当前关开始
      chLives = MAX_LIVES;
      chCombo = 0;
      chMaxCombo = 0;
      document.getElementById('chGameover').classList.add('hidden');
      chStartLevel();
    }

    function exitChallenge() {
      clearInterval(chTimerInterval);
      chActive = false;
      document.getElementById('challengeOverlay').classList.add('hidden');
      document.getElementById('chResultScreen').classList.add('hidden');
      document.getElementById('chGameover').classList.add('hidden');
    }

    // ===== 粒子特效 =====
    const pCanvas = document.getElementById('particleCanvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];
    let pAnimId = null;

    function resizeCanvas() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function spawnParticles(correct) {
      const colors = correct
        ? ['#10b981','#14b8a6','#5eead4','#fbbf24','#a7f3d0']
        : ['#f43f5e','#fb923c','#fbbf24'];
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight * 0.45;
      const count = correct ? 40 : 15;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = correct ? (3 + Math.random() * 5) : (1.5 + Math.random() * 3);
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (correct ? 3 : 1),
          r: 4 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1, decay: 0.018 + Math.random() * 0.015,
          gravity: 0.15
        });
      }
      if (!pAnimId) pAnimLoop();
    }

    function pAnimLoop() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      particles = particles.filter(p => p.life > 0);
      for (const p of particles) {
        p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
        p.life -= p.decay;
        pCtx.save();
        pCtx.globalAlpha = p.life;
        pCtx.fillStyle = p.color;
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.restore();
      }
      if (particles.length > 0) {
        pAnimId = requestAnimationFrame(pAnimLoop);
      } else {
        pAnimId = null;
      }
    }

    function fireConfetti() {
      const colors = ['#f59e0b','#ef4444','#10b981','#0ea5e9','#8b5cf6','#f472b6'];
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          particles.push({
            x: Math.random() * window.innerWidth,
            y: -10,
            vx: (Math.random() - 0.5) * 4,
            vy: 2 + Math.random() * 4,
            r: 5 + Math.random() * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1, decay: 0.008 + Math.random() * 0.01,
            gravity: 0.08
          });
          if (!pAnimId) pAnimLoop();
        }, i * 20);
      }
    }

    // ===== Combo 爆字特效 =====
    function showComboPopup(n) {
      const el = document.createElement('div');
      el.className = 'combo-popup';
      const msgs = {
        3: '🔥 x3 COMBO!', 4: '⚡ x4 HOT!', 5: '💥 x5 FIRE!!',
        6: '🌟 x6 BLAZING!', 7: '🚀 x7 INSANE!', 8: '👑 x8 GODLIKE!',
        9: '🎯 x9 PERFECT!', 10: '✨ x10 LEGENDARY!!'
      };
      const msg = msgs[n] || (n > 10 ? `🏆 x${n} UNSTOPPABLE!!` : null);
      if (!msg) return;
      const gradients = [
        'linear-gradient(135deg,#f59e0b,#ef4444)',
        'linear-gradient(135deg,#8b5cf6,#f472b6)',
        'linear-gradient(135deg,#10b981,#0ea5e9)'
      ];
      el.style.cssText = `background:${gradients[n % 3]};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(245,158,11,0.6))`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }
  </script>
</body>
